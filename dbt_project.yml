
name: 'de_portfolio_dbt'
version: '1.0.0'
config-version: 2

profile: 'de_portfolio_dbt'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

seeds:
  de_portfolio_dbt:
    raw_orders:
      +column_types:
        order_id: integer
        customer_id: integer
        order_date: date
        amount: integer
        cost: integer
        status: varchar
        updated_at: timestamp

vars:
  minimum_order_amount: 1000
  apply_minimum_amount_filter: false

models:
  de_portfolio_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
