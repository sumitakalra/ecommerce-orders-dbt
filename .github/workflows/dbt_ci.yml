
name: dbt CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dbt
        run: pip install dbt-duckdb==1.11.1

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          de_portfolio_dbt:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ecommerce.duckdb
                threads: 4
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: Build dbt project
        run: dbt build
