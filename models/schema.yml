
version: 2

models:
  - name: stg_orders
    description: "Cleans and standardizes raw e-commerce order data."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - unique
          - not_null

  - name: int_order_profit
    description: "Calculates profit for each order using amount minus cost, with configurable minimum amount filtering."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - unique
          - not_null

      - name: amount
        description: "Total order amount."

      - name: cost
        description: "Total cost associated with the order."

      - name: profit
        description: "Calculated profit: order amount minus cost."

      - name: updated_at
        description: "Timestamp of the latest order update."

  - name: fct_orders
    description: "Analytics mart containing delivered orders only."
    columns:
      - name: order_id
        description: "Unique identifier for each delivered order."
        data_tests:
          - unique
          - not_null

      - name: status
        description: "Order delivery status; only delivered orders are included."
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered']

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - customer_id

  - name: dim_dates
    description: "Date dimension containing calendar dates for analytical reporting."
